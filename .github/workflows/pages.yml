name: Pages

on:
  push:
    branches: [master, feat-refactor]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - name: assemble site from docs/
      run: |
        mkdir _site
        cp -r docs/. _site/
        # relative links to repo files only work locally; point them to GitHub on the hosted page
        BLOB="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}"
        sed -i -e "s#href=\"\.\./#href=\"$BLOB/#g" \
               -e "s#href=\"howto\.md\"#href=\"$BLOB/docs/howto.md\"#g" _site/index.html

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - id: deployment
      uses: actions/deploy-pages@v4
