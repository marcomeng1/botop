name: CMake

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - uses: prefix-dev/setup-pixi@v0.8
      with:
        cache: true

    - name: cache source-built deps (fcl, qhull, physx)
      uses: actions/cache@v4
      with:
        path: .pixi/src
        key: deps-${{ hashFiles('scripts/build_deps.sh') }}

    - name: build
      run: pixi run build

    - name: install into pixi env
      run: pixi run install

    - name: python smoke test (simulation, headless)
      run: |
        sudo apt-get install --yes xvfb
        xvfb-run -a pixi run python test/py/test.py
